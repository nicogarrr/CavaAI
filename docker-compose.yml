# ============================================
# Docker Compose - Entorno Completo de Desarrollo
# ============================================

services:
  # ==========================================
  # MongoDB - auth and existing app data
  # ==========================================
  mongodb:
    image: mongo:7
    container_name: cavaai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cavaai
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-example}
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USERNAME:-root}", "-p", "${MONGO_ROOT_PASSWORD:-example}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # PostgreSQL - research canonical store
  # ==========================================
  postgres:
    image: postgres:17
    container_name: cavaai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-portfolio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-portfolio}
      - POSTGRES_DB=${POSTGRES_DB:-cavaai_research}
      - TZ=UTC
      - PGTZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-cavaai_research}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Redis - cache, locks, budgets and jobs
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: cavaai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Qdrant - vector store for RAG
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: cavaai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # La imagen de Qdrant no incluye curl/wget: GET /healthz con bash (/dev/tcp).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MinIO - local S3-compatible raw document store
  # ==========================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cavaai-minio
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-portfolio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-portfoliosecret}
    healthcheck:
      # La imagen minio/minio no incluye `mc`: sonda HTTP al endpoint live (200 sin auth).
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Backend Python (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./data-engine
      dockerfile: Dockerfile
    container_name: cavaai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data-engine:/app
      - /app/__pycache__
      - /app/.venv
    environment:
      - APP_ENV=${APP_ENV:-local}
      - RESEARCH_AUTH_REQUIRED=true
      - RESEARCH_AUTH_SECRET=${RESEARCH_AUTH_SECRET:?Set RESEARCH_AUTH_SECRET in .env}
      - FMP_API_KEY=${FMP_API_KEY}
      # --- Proveedores market data (degradacion documentada por clave) ---
      # Sin FINNHUB_API_KEY: screener y quotes sin Finnhub (fallback Yahoo).
      # Sin FMP_API_KEY: sin contraste SEC/FMP (cobertura marcada no disponible).
      # Sin FRED_API_KEY: sin macro FRED.
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SCREENER_QUOTE_VENDOR=${SCREENER_QUOTE_VENDOR:-finnhub}
      # Jev (micro-decisiones): sin TYPESAFE_API_KEY el cliente no se
      # construye y el triaje sigue sin esa capa.
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      # --- Telegram (alertas + aprobacion de tesis) ---
      # Sin estas claves no se envia nada (canal primario degradado a UI).
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      # --- RAG vectorial: solo mapeo, los flags viven documentados aqui ---
      # Sin =1 no hay ingesta/busqueda/chat vectorial (degradacion a SQL).
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - CAVAAI_ENABLE_VECTOR_CHAT=${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-deepseek-v4-flash}
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-portfolio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-portfoliosecret}
      - MINIO_BUCKET=research
      - DUCKDB_PATH=/app/storage/analytics.duckdb
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    healthcheck:
      # python:3.12-slim no trae curl: sonda equivalente a `curl -f http://localhost:8000/health/ready`.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ==========================================
  # Background worker - research jobs
  # ==========================================
  worker:
    build:
      context: ./data-engine
      dockerfile: Dockerfile
    container_name: cavaai-worker
    restart: unless-stopped
    volumes:
      - ./data-engine:/app
      - /app/__pycache__
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      # El worker ejecuta actores Dramatiq que llaman a los mismos conectores
      # que el backend: necesita las mismas claves de proveedores.
      # Sin FMP_API_KEY: refresh de mercado sin contraste FMP.
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SCREENER_QUOTE_VENDOR=${SCREENER_QUOTE_VENDOR:-finnhub}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      # Alertas Telegram enviadas desde actores: sin esto, degradado a UI.
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      # Ingesta vectorial (document_ingestion_service): sin =1 no indexa Qdrant.
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - CAVAAI_ENABLE_VECTOR_CHAT=${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-deepseek-v4-flash}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-portfolio}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-portfoliosecret}
      - MINIO_BUCKET=research
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - RSS_FEEDS=${RSS_FEEDS:-}
    healthcheck:
      # Sin HTTP: dramatiq vivo (PID 1) + Redis de cola accesible.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'dramatiq' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["dramatiq", "app.workers.dramatiq_app"]

  # ==========================================
  # Scheduler - recurring research jobs
  # ==========================================
  scheduler:
    build:
      context: ./data-engine
      dockerfile: Dockerfile
    container_name: cavaai-scheduler
    restart: unless-stopped
    volumes:
      - ./data-engine:/app
      - /app/__pycache__
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-deepseek-v4-flash}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - TZ=UTC
    healthcheck:
      # Sin HTTP: scheduler vivo (PID 1) + Redis accesible.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'app.workers.scheduler' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.scheduler"]

  # ==========================================
  # Frontend Next.js
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cavaai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-example}@mongodb:27017/cavaai?authSource=admin
      - FMP_BACKEND_URL=http://backend:8000
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-deepseek-v4-flash}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - RESEARCH_AUTH_REQUIRED=true
      - RESEARCH_AUTH_SECRET=${RESEARCH_AUTH_SECRET:?Set RESEARCH_AUTH_SECRET in .env}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    healthcheck:
      # node:alpine sin curl: fetch nativo de Node 22.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ==========================================
  # Langfuse observability profile
  # ==========================================
  clickhouse:
    profiles: ["observability"]
    image: clickhouse/clickhouse-server:24.8
    container_name: cavaai-clickhouse
    restart: unless-stopped
    user: "101:101"
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-worker:
    profiles: ["observability"]
    image: langfuse/langfuse-worker:3
    container_name: cavaai-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NEXTAUTH_URL: http://localhost:3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-cavaai-local-langfuse-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-portfolio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-portfoliosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-portfolio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-portfoliosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

  langfuse-web:
    profiles: ["observability"]
    image: langfuse/langfuse:3
    container_name: cavaai-langfuse-web
    restart: unless-stopped
    depends_on:
      langfuse-worker:
        condition: service_started
    ports:
      - "3002:3000"
    environment:
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: http://localhost:3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-cavaai-local-langfuse-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-portfolio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-portfoliosecret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-portfolio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-portfoliosecret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: cavaai
      LANGFUSE_INIT_ORG_NAME: CavaAI
      LANGFUSE_INIT_PROJECT_ID: local
      LANGFUSE_INIT_PROJECT_NAME: Local Research
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local}
      LANGFUSE_INIT_USER_EMAIL: local@example.com
      LANGFUSE_INIT_USER_NAME: Local Analyst
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

volumes:
  mongodb_data:
    name: cavaai-mongodb-data
  postgres_data:
    name: cavaai-postgres-data
  qdrant_data:
    name: cavaai-qdrant-data
  minio_data:
    name: cavaai-minio-data
  clickhouse_data:
    name: cavaai-clickhouse-data
  clickhouse_logs:
    name: cavaai-clickhouse-logs
