# Render Blueprint — despliegue cloud opcional del data-engine.
# Nota: en el tier FREE los web services hibernan tras ~15 min de inactividad,
# por lo que el scheduler de workers NO corre 24/7. Para workers siempre
# activos en cloud se requiere el tier paid (o el PC local como Scheduled Task).
#
# Este fichero vive en la RAÍZ del repo: Render solo lee /render.yaml.
# Resolucion de rutas (ver https://render.com/docs/monorepo-support):
#   - rootDir mueve la raiz del servicio a data-engine/ y hace que
#     dockerfilePath se resuelva RELATIVA A ESA raiz (=> data-engine/Dockerfile.prod,
#     el de produccion; el Dockerfile del frontend quedaria en la raiz).
#   - dockerContext se resuelve relativo a la raiz del repo.
services:
  - type: web
    name: cavaai-backend
    runtime: docker
    plan: free
    rootDir: data-engine
    dockerfilePath: Dockerfile.prod
    dockerContext: ./data-engine
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: RESEARCH_AUTH_SECRET
        sync: false
      # Postgres externo (Supabase free): la URL se define en el dashboard
      # de Render; las migraciones corren en el arranque del Dockerfile.
      - key: DATABASE_URL
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: OPENCODE_GO_API_KEY
        sync: false
      - key: OPENCODE_GO_BASE_URL
        sync: false
      - key: OPENCODE_GO_MODEL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WORKERS_ENABLED
        value: "false"
