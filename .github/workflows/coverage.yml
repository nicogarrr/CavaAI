name: Coverage

# Job propio y DELIBERADAMENTE INDEPENDIENTE de .github/workflows/ci.yml.
# Motivo: la cobertura con branch=True tarda bastante mas que `python -m pytest`
# a secas, y encadenarla al job `backend` alargaria el feedback de todos los
# PRs para que solo lo paguen los cambios de data-engine. Ademas este job fija
# un entorno de medicion DETERMINISTA (ver nota de Qdrant mas abajo) que no
# coincide con el de `backend`, asi que mezclarlos haria la linea base fragil.
#
# El gate es fail-closed y fail-closed tambien en la explicacion: si falla, el
# mensaje dice que paquete bajo y cuantos puntos. Ver docs/COVERAGE.md, y
# data-engine/COVERAGE.md como enlace a ese documento.

on:
  push:
    paths:
      - "data-engine/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "data-engine/**"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

# shell por defecto: `bash` explicito (= `bash --noprofile --norc -eo pipefail
# {0}`). Sin `shell:`, GitHub usa `bash -e {0}` (SIN pipefail) y cualquier
# `cmd | tee log` devuelve el exit code de `tee` (FIX-3.2).
defaults:
  run:
    shell: bash

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  # PR -> true: el run viejo ya no describe el codigo que se revisa.
  # push -> false: este workflow PUBLICA el informe de cobertura como
  #   artefacto (retention 14 dias). Cancelar un push a mitad deja el commit
  #   sin informe y sin evidencia de que el gate se ejecuto: la evidencia
  #   publicada no se cancela (mismo criterio que restore-drill y sbom-scan).
  #   El coste es que una rafaga de pushes encole runs completos; se acepta.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Backend coverage gate
    runs-on: ubuntu-latest
    # La suite instrumentada con branch=True tarda bastante mas que la normal.
    # Sal timeout de margen: cortarlo a mitad dejaria a medias el .coverage y
    # el gate leeria un numero sin sentido.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: data-engine
    env:
      # Mismo aislamiento que el job `backend` de ci.yml.
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_coverage.db
      RESEARCH_AUTH_REQUIRED: "false"
      WORKERS_ENABLED: "false"
      # Sin vector ingest/search/chat: la linea base se midio con esto apagado,
      # asi que el gate mide siempre el mismo conjunto de tests.
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_SEARCH: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-python SOLO aporta el interprete 3.12; instalar lo hace uv, con
      # el lock (FIX-3.3/3.4). Sin `cache: pip` ni pins de herramientas: el
      # lock trae ruff==0.16.10 y pyright==1.1.414 via el extra `dev`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"

      # cache_dir de [tool.pytest.ini_options] es storage/.pytest_cache.
      # La cache se keya por uv.lock (quien decide que se instala), no por
      # requirements.txt.
      - name: Cache pytest and coverage artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data-engine/storage/.pytest_cache
            data-engine/htmlcov
          key: coverage-${{ runner.os }}-${{ hashFiles('data-engine/uv.lock') }}
          restore-keys: |
            coverage-${{ runner.os }}-

      # Instalacion congelada desde uv.lock (FIX-3.3). --extra test trae
      # pytest-cov (que a proposito NO esta en requirements.txt: el job
      # dep-parity exige paridad exacta y bidireccional entre
      # [project].dependencies y requirements.txt, y pytest-cov vive en
      # [project.optional-dependencies]). --extra dev trae ruff y pyright.
      - run: uv sync --frozen --extra test --extra dev --no-install-project

      # PEAJE DOCUMENTADO (FIX-3.10, decision (a)): la suite entera de pytest
      # corre DOS veces por push y por PR -- aqui (instrumentada, branch=True)
      # y en el job `backend` de ci.yml (sin instrumentar). Medido:
      #   - docs/COVERAGE.md: 12 min (724 s) la suite con cobertura en Windows.
      #   - job `backend` de ci.yml: ~11 min la suite sin instrumentar.
      #   => ~24 min de runner duplicados por push y por PR.
      # Se mantiene asi a proposito (feedback desacoplado + medicion
      # determinista con su propia linea base), pero el entorno ya NO es tan
      # distinto como justificaba C5: ambos jobs fijan APP_ENV=test,
      # CAVAAI_ENABLE_VECTOR_*=0 e instalan AHORA el mismo uv.lock; solo
      # difiere DATABASE_URL (sqlite de cobertura vs sqlite de CI) y la
      # instrumentacion. Si algun dia se quiere ahorrar el duplicado, el
      # candidato es fusionar el gate de cobertura como paso final de
      # `backend` con un unico `pytest --cov`, manteniendo
      # run_coverage_gate.py como ratchet. NO se hace aqui (FIX-3: solo
      # workflows, y fusionar cambia el contrato del gate).
      # decision (b) pendiente: partir Playwright entre e2e y browser-e2e
      # (--grep @ui / --grep-invert @ui) exige etiquetar e2e/*.spec.ts, que
      # esta fuera de la propiedad de este cambio. Reportado.
      - name: Coverage gate (pytest --cov + ratchet por paquete)
        run: uv run --frozen python scripts/run_coverage_gate.py

      - name: Informe legible para logs
        if: ${{ always() }}
        run: uv run --frozen python -m coverage report --rcfile=.coveragerc --show-missing || true

      # Sin secrets ni tokens: el informe se publica siempre como artefacto, que
      # es lo que cualquiera puede leer. Si algun dia se quiere subir a un
      # servicio externo (Codecov, Coveralls) hace falta anadir el secret y el
      # paso correspondiente; hasta entonces no se pone ningun token.
      - name: Publish coverage report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: |
            data-engine/htmlcov/index.html
            data-engine/htmlcov/coverage.json
            data-engine/htmlcov/.coverage
          if-no-files-found: warn
          retention-days: 14
