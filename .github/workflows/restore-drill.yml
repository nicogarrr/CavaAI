name: Restore drill

# El ciclo backup -> destruir -> restore -> verificar de los TRES pilares, en un
# entorno efimero, en cada push. Es el unico sitio donde se demuestra que un
# backup de este repo se puede recuperar de verdad.
#
# Por que un workflow propio y no un job de ci.yml: este drill levanta tres
# services mas, destruye su entorno para reconstruirlo, y arranca la aplicacion
# completa contra la base restaurada. Con el tiempo que cuesta, mezclado con los
# demas jobs de CI, haria que TODOS dejaran de ser fiables cuando algo va mal.
#
# Por que NO es bloqueante de PR y SI de main: el drill levanta servicios,
# instala el data-engine completo (torch CPU incluido) y arranca FastAPI; en un
# runner frio son ~10 minutos. Bloquear un PR por eso cuesta mas de lo que
# protege: el gate que si bloquea el PR es `tests/test_backup_contracts.py`, que
# corre en el job `backend` de ci.yml y es de segundos. En `main` si bloquea:
# ahi el backup es el que va a proteger produccion, y un restore roto tiene que
# stops el pipeline, no colarse como un check mas. La decison se repite en el
# `if:` de abajo para que no dependa de la intuicion de quien lea el YAML.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# shell por defecto: `bash` explicito (= `bash --noprofile --norc -eo pipefail
# {0}`); sin el, los pipes (`| grep`, `| tee`) devuelven el exit code del
# ultimo comando y un paso puede pasar con el comando real en rojo (FIX-3.2).
defaults:
  run:
    shell: bash

# Un drill por rama y NUNCA cancelado (FIX-3.6): este workflow publica el
# manifiesto del backup y los informes de verificacion como evidencia forense
# (retention 7 dias). Con cancel-in-progress: true, una rafaga de pushes
# cancelaba los drills a mitad y la evidencia se perdia; peor: `block-on-main`
# acababa evaluando el verde de un drill a medio hacer. Con false, GitHub
# encola el siguiente y cada drill conserva su evidencia completa. El coste
# (rafagas de pushes encolan drills de ~45 min) se acepta: la evidencia de un
# restore verificado no se cancela.
concurrency:
  group: restore-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-drill:
    name: Backup -> restore -> verify (Postgres, MinIO, Qdrant)
    runs-on: ubuntu-latest
    # Margen para: install de requirements (torch CPU), seed, backup, destruccion,
    # restore y arranque de uvicorn. Si se pasa, algo esta colgado, no lento.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: cavaai_drill_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d cavaai_drill_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      minio:
        # La imagen oficial quay.io/minio/minio ya no es publica (401 anonimo, ver PR); solo para este drill de CI.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: drilluser
          MINIO_ROOT_PASSWORD: drillpassword123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ $status == *\" 200 \"* ]]'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ $status == *\" 200 \"* ]]'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      APP_ENV: test
      CI: "true"
      # La app arranca contra la base restaurada: postgres-cgi y redis son
      # opcionales para /health/ready, por eso REDIS_URL no apunta a ningun sitio.
      RESEARCH_AUTH_REQUIRED: "false"
      WORKERS_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@127.0.0.1:5432/cavaai_drill_source
      REDIS_URL: redis://127.0.0.1:6379/15
      QDRANT_URL: http://127.0.0.1:6333
      VECTOR_STORE: qdrant
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: drilluser
      MINIO_SECRET_KEY: drillpassword123
      DRILL_MINIO_ACCESS_KEY: drilluser
      DRILL_MINIO_SECRET_KEY: drillpassword123
      MINIO_BUCKET: research
      DOCUMENT_STORAGE_BACKEND: minio
      DRILL_BUCKET: research
      DRILL_COLLECTION: portfolio_research_documents
      DUCKDB_PATH: /tmp/analytics.duckdb
      LANGFUSE_ENABLED: "false"
      SEC_USER_AGENT: CavaAI-drill contact@example.com
      BACKUP_DIR: /tmp/cavaai-drill-backup
      # Postgres en modo contenedor: usa el pg_dump 17.x del propio contenedor,
      # en vez del cliente del runner (que seria 16 y abortaria contra el 17).
      POSTGRES_CONTAINER: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"

      - name: Install data-engine dependencies
        # Instalacion CONGELADA desde uv.lock (FIX-3.3/3.4): un drill que
        # resuelve distinto en cada run no demuestra nada sobre el backup del
        # commit. El backup usa el SDK de MinIO y la API HTTP de Qdrant, que
        # vienen en el lock; no hace falta `mc` ni el cliente de Postgres del
        # runner: el dump se ejecuta dentro del contenedor postgres:17.
        # --extra test / --extra dev traen pytest y ruff para los pasos finales.
        working-directory: data-engine
        run: uv sync --frozen --extra test --extra dev --no-install-project

      - name: Resolve the Postgres service container
        # Los services de GitHub no tienen nombre estable: se localiza por
        # imagen. Asi el backup usa el cliente 17.x del propio servidor y el
        # drill no depende del cliente del runner (que seria 16 y abortaria).
        # FIX-3.7: UNICO y verificado, nunca `head -1` a ciegas. En un runner
        # self-hosted (o una VM reusada) puede haber otro postgres:17 en
        # marcha, y elegirlo llevaria el `DROP DATABASE ... WITH (FORCE)` del
        # paso siguiente a la base de otra persona.
        run: |
          mapfile -t PGS < <(docker ps --filter ancestor=postgres:17 --format '{{.ID}}')
          if [ "${#PGS[@]}" -ne 1 ]; then
            echo "::error::se esperaba 1 contenedor postgres:17 y hay ${#PGS[@]}; no se elige a ciegas"
            exit 1
          fi
          PG_ID="${PGS[0]}"
          echo "POSTGRES_CONTAINER=${PG_ID}" >> "${GITHUB_ENV}"

      - name: Wait for MinIO and Qdrant
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && break || sleep 2; done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:6333/healthz >/dev/null && break || sleep 2; done
          curl -fsS http://127.0.0.1:6333/healthz >/dev/null

      - name: Seed deterministic data (N rows, M objects, P points of dimension D)
        # El MISMO siemembro que usa disaster_drill.py: si Sembraran distinto,
        # el manifest que uno verifica no seria el que el otro restorea.
        working-directory: data-engine
        run: uv run --frozen python -m scripts.backup.seed_drill_data

      - name: Backup the three pillars
        working-directory: data-engine
        run: |
          uv run --frozen python -m scripts.backup.backup_all \
            --out "${BACKUP_DIR}" \
            --pg-mode docker \
            --pg-container "${POSTGRES_CONTAINER}" \
            --pg-database cavaai_drill_source \
            --pg-user portfolio \
            --minio-endpoint 127.0.0.1:9000 \
            --minio-access-key "${MINIO_ACCESS_KEY}" --minio-secret-key "${MINIO_SECRET_KEY}" \
            --minio-bucket "${DRILL_BUCKET}" \
            --qdrant-url http://127.0.0.1:6333 \
            --qdrant-collection "${DRILL_COLLECTION}"

      - name: Destroy the source database and re-create it empty
        # "Destino limpio" de verdad: la base que se va a restaurar no existe
        # todavia. DROP + CREATE deja el cluster como recien inicializado.
        run: |
          docker exec "${POSTGRES_CONTAINER}" psql --username=portfolio --dbname=postgres \
            -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS cavaai_drill_source WITH (FORCE)'
          docker exec "${POSTGRES_CONTAINER}" psql --username=portfolio --dbname=postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cavaai_drill_source'
          docker exec "${POSTGRES_CONTAINER}" psql --username=portfolio --dbname=cavaai_drill_source \
            -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | grep -qx 0

      - name: Restore Postgres to the clean destination
        working-directory: data-engine
        run: |
          uv run --frozen python -m scripts.restore.restore_postgres \
            --manifest "${BACKUP_DIR}" \
            --mode docker --container "${POSTGRES_CONTAINER}" --user portfolio \
            --confirm-restore

      - name: Restore MinIO
        working-directory: data-engine
        run: |
          uv run --frozen python -m scripts.restore.restore_minio \
            --manifest "${BACKUP_DIR}" \
            --endpoint 127.0.0.1:9000 \
            --access-key "${MINIO_ACCESS_KEY}" --secret-key "${MINIO_SECRET_KEY}" \
            --bucket "${DRILL_BUCKET}" \
            --confirm-restore

      - name: Restore Qdrant
        working-directory: data-engine
        run: |
          uv run --frozen python -m scripts.restore.restore_qdrant \
            --manifest "${BACKUP_DIR}" \
            --url "${QDRANT_URL}" \
            --confirm-restore

      - name: Verify the restored data (before booting the app)
        # ANTES de arrancar la app: su lifespan llama a ensure_company_master()
        # con APP_ENV != production e inserta filas, lo que compararia contra el
        # manifiesto como si el restore hubiera perdido datos.
        working-directory: data-engine
        run: |
          uv run --frozen python -m scripts.restore.verify_restore \
            --manifest "${BACKUP_DIR}" \
            --pg-mode docker --pg-container "${POSTGRES_CONTAINER}" --pg-user portfolio \
            --minio-endpoint 127.0.0.1:9000 \
            --minio-access-key "${MINIO_ACCESS_KEY}" --minio-secret-key "${MINIO_SECRET_KEY}" \
            --qdrant-url "${QDRANT_URL}" \
            --report-out /tmp/verify_report_data.json \
            --phase data

      - name: Start the app against the restored database
        working-directory: data-engine
        run: |
          nohup uv run --frozen python -m uvicorn main:app --host 127.0.0.1 --port 8000 --log-level warning \
            > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/health/live >/dev/null && break || sleep 2
          done
          if ! curl -fsS http://127.0.0.1:8000/health/live >/dev/null; then
            echo "::error::la app no arranco contra la base restaurada"
            tail -40 /tmp/uvicorn.log
            exit 1
          fi

      - name: Verify the restored app serves data
        working-directory: data-engine
        run: |
          uv run --frozen python -m scripts.restore.verify_restore \
            --manifest "${BACKUP_DIR}" \
            --pg-mode docker --pg-container "${POSTGRES_CONTAINER}" --pg-user portfolio \
            --minio-endpoint 127.0.0.1:9000 \
            --minio-access-key "${MINIO_ACCESS_KEY}" --minio-secret-key "${MINIO_SECRET_KEY}" \
            --qdrant-url "${QDRANT_URL}" \
            --app-base-url http://127.0.0.1:8000 \
            --report-out /tmp/verify_report_app.json \
            --phase app

      - name: No check may be skipped
        # El gate fail-closed, explicito y auditable: si el informe no trae las
        # seis comprobaciones con `passed`, el drill NO esta verificado. Es el
        # mismo principio que el gate de RAG de ci.yml; aqui no se depende de
        # parsear la salida de pytest.
        run: |
          python - <<'PY'
          import json
          import sys

          ESPERADAS = {
              "data": {"a_esquema", "b_conteos", "c_alembic", "e_objetos", "f_vectores"},
              "app": {"d_aplicacion"},
          }
          informes = {
              "data": json.load(open("/tmp/verify_report_data.json", encoding="utf-8")),
              "app": json.load(open("/tmp/verify_report_app.json", encoding="utf-8")),
          }
          fallos = []
          for fase, esperadas in ESPERADAS.items():
              informe = informes[fase]
              hechas = {c["name"] for c in informe["checks"]}
              if hechas != esperadas:
                  fallos.append(f"{fase}: comprobaciones {hechas} != {esperadas}")
              if not informe["ok"]:
                  for check in informe["checks"]:
                      if not check["passed"]:
                          fallos.append(f"{fase}/{check['name']}: {check['detail']}")
          if fallos:
              for fallo in fallos:
                  print(f"::error::{fallo}")
              sys.exit(1)
          print("6/6 comprobaciones ejecutadas y superadas: no hay ninguna omitida")
          PY

      - name: Manifest and verification reports
        # Sin esto, un fallo en un runner futuro se depura sin datos.
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/drill-artifacts
          cp -r "${BACKUP_DIR}" /tmp/drill-artifacts/ 2>/dev/null || true
          cp /tmp/verify_report_data.json /tmp/drill-artifacts/ 2>/dev/null || true
          cp /tmp/verify_report_app.json /tmp/drill-artifacts/ 2>/dev/null || true
          cp /tmp/uvicorn.log /tmp/drill-artifacts/ 2>/dev/null || true
          ls -la /tmp/drill-artifacts

      - name: Upload drill artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-drill-${{ github.run_id }}
          path: /tmp/drill-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Contract tests (manifest, fail-closed, runbook, pins)
        working-directory: data-engine
        run: uv run --frozen python -m pytest tests/test_backup_contracts.py -q

      - name: Lint the backup and restore scripts
        # Los scripts viven dentro de data-engine/ para que este `ruff check .`
        # los cubra; si alguien los mueve a scripts/ del repo, esto deja de
        # revisar el codigo que produce los backups.
        working-directory: data-engine
        run: uv run --frozen ruff check .

  block-on-main:
    name: Require the drill in main
    # La decision del encabezado, ejecutada: en `main` el drill bloquea el
    # merge aunque venza de un pull_request. Se implementa como un job aparte
    # que reejecuta el job principal con `needs` y falla si el evento no es un
    # push a main; el nombre del check que ve el branch protection es este.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: restore-drill
    timeout-minutes: 5
    steps:
      - name: The drill has to have passed to reach main
        run: |
          if [ "${{ needs.restore-drill.result }}" != "success" ]; then
            echo "::error::el restore drill fallo en main: el backup verificado no es de fiar"
            exit 1
          fi
          echo "restore drill OK en main"
