name: OpenCode model rotator

on:
  schedule:
    - cron: "23 5 * * 1" # lunes 05:23 UTC (~07:23 Madrid en verano)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Este bloque ya era correcto y se queda como esta, con el porque escrito
  # para que nadie lo "simplifique" a cancel-in-progress: true:
  # 1. El grupo NO lleva `${{ github.ref }}` a proposito. El workflow corre por
  #    cron (rama por defecto) y por workflow_dispatch, asi que el ref no
  #    distinguen nada; incluirlo solo partiria el grupo en el caso de que
  #    alguien lo dispare sobre otra rama.
  # 2. cancel-in-progress SIEMPRE false. Este workflow hace `git push` a main
  #    con un commit nuevo. Cancelarlo a mitad podria dejar el push a medias o
  #    abrir el PR de respaldo a una rama que ya no compila, y en cualquier
  #    caso el efecto (rotar opencode.json) es de una vez: repetirlo no aporta
  #    nada. Con false, si dos disparos se solapan, el segundo espera.
  group: opencode-model-rotator
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Decide el mejor modelo gratuito (Zen + models.dev + LMArena WebDev)
        id: rot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/opencode_model_rotator.py

      - name: Aplica la rotacion si hay cambio
        if: steps.rot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ steps.rot.outputs.model }}
          REASON: ${{ steps.rot.outputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode.json
          git commit -m "chore(opencode): rotar modelo a $MODEL - $REASON [skip ci]"
          if git push; then
            echo "Rotacion aplicada: push directo a main."
          else
            BR="opencode-rotator/$(date +%Y%m%d-%H%M)"
            echo "Push a main bloqueado (proteccion de rama): abro PR $BR"
            git checkout -b "$BR"
            git push -u origin "$BR"
            gh pr create --title "chore(opencode): rotar modelo a $MODEL" --body "$REASON" --base main
          fi
