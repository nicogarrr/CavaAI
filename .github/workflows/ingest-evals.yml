name: Ingest precision evals

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# shell por defecto: `bash` explicito (= `bash -eo pipefail`); sin el, los
# pipes de los `run:` pierden el exit code del comando real (FIX-3.2).
defaults:
  run:
    shell: bash

concurrency:
  group: ingest-evals-${{ github.ref }}
  # true JUSTIFICADO (FIX-3.6): este workflow NO publica artefactos (solo
  # informa en el log y en el summary) y no deja evidencia forense que
  # conservar. Un run superseded no describe el codigo que se revisa y cuesta
  # un runner; se cancela.
  cancel-in-progress: true

jobs:
  ingest-precision:
    name: Ingest precision (C4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_ingest_evals.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Instalacion congelada desde uv.lock (FIX-3.3/3.4): sin pins sueltos y
      # sin resolver por rangos. setup-python solo aporta el interprete 3.12.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      - run: uv sync --frozen --extra test --extra dev --no-install-project
      # 79 casos contra la ingesta real (SEC/EDGAR, FMP, ESEF) con corpus
      # sintetico declarado y guardian de sockets. Las cuatro metricas con
      # umbral (field accuracy, period attribution, source attribution y
      # abstention) mas la cobertura por puerta y por familia de fuente.
      - name: Runner de precision de ingesta
        run: uv run --frozen python scripts/run_ingest_evals.py
      - name: Contratos de puerta y guardian de red
        run: uv run --frozen python -m pytest tests/test_ingest_eval_contracts.py tests/test_ingest_eval_fixtures.py -q
