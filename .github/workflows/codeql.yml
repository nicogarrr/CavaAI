name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# shell por defecto: `bash` explicito (= `bash -eo pipefail`) (FIX-3.2). Este
# workflow no tiene `run:` propios hoy (solo actions), pero el default deja
# cubierto cualquier paso que se anada.
defaults:
  run:
    shell: bash

concurrency:
  # Por ref, como en ci.yml: sin el, el run de `schedule` (rama por defecto) y
  # el de un push a main se cancelarian entre si.
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR -> true: el analisis del commit viejo no sirve de nada.
  # main y schedule -> false: este workflow NO es un linter. El paso
  # `codeql-action/analyze` SUBE SARIF al code scanning de GitHub, y cancelar a
  # mitad deja el panel de seguridad a medio actualizar para ese commit, que es
  # justo el estado en el que no se puede confiar. Un escaner que se cancela da
  # una falsa impresion de "sin alertas".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      # false a proposito: los dos analisis (js y python) se reportan aunque uno
      # falle. Con true, un fallo de python mataria el de javascript y el panel
      # de seguridad mostraria "javascript: sin alertas" cuando en realidad no se
      # llego a mirar. El coste (un runner mas) es menor que un panel mentiroso.
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
