name: SEC to HuggingFace mirror sync

on:
  schedule:
    # Cada 6 horas: la SEC actualiza companyfacts tras cada filing.
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

# shell por defecto: `bash` explicito (= `bash -eo pipefail`) (FIX-3.2).
defaults:
  run:
    shell: bash

concurrency:
  # Sin `${{ github.ref }}` a proposito, y con cancel-in-progress SIEMPRE false.
  # Este workflow corre cada 6 horas y su unico efecto es escribir en el dataset
  # de HuggingFace. Un grupo por ref + cancelacion dejaria huecos: si el run de
  # las 03:00 se cancela al llegar el de las 09:00, companyfacts se queda sin
  # sincronizar esas 6 horas y no hay forma de saberlo. Con false, GitHub
  # encola el siguiente y la serie nunca se pisa a si misma ni se solapa.
  group: sec-hf-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # FIX-3.5: "3.12", como el resto de jobs y como exige el contrato de
      # data-engine (requires-python = ">=3.12,<3.13", .python-version,
      # ruff.toml py312, pyrightconfig.json 3.12).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # FIX-3.3/3.4: httpx y huggingface_hub salen de uv.lock (httpx es
      # dependencia directa; huggingface-hub, transitiva), fijados y con hash.
      # Antes `pip install httpx huggingface_hub` sin pin: la sync de las 6h
      # podia correr con un huggingface_hub distinto cada vez.
      - run: uv sync --frozen --no-install-project
        working-directory: data-engine
      - name: Sync SEC -> HuggingFace dataset
        env:
          HF_TOKEN: ${{ secrets.HF_MIRROR_TOKEN }}
          HF_DATASET: ${{ vars.HF_MIRROR_DATASET }}
          # Contacto real declarado a la SEC (la SEC banea placeholders).
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run --frozen --project data-engine python data-engine/scripts/sec_hf_mirror_sync.py
