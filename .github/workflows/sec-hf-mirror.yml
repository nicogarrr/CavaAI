name: SEC to HuggingFace mirror sync

on:
  schedule:
    # Cada 6 horas: la SEC actualiza companyfacts tras cada filing.
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx huggingface_hub
      - name: Sync SEC -> HuggingFace dataset
        env:
          HF_TOKEN: ${{ secrets.HF_MIRROR_TOKEN }}
          HF_DATASET: ${{ vars.HF_MIRROR_DATASET }}
          # Contacto real declarado a la SEC (la SEC banea placeholders).
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python data-engine/scripts/sec_hf_mirror_sync.py
