name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Minimos por workflow. Ningun job de CI escribe en el repo, abre PRs ni
# publica releases: `contents: read` es todo lo que `actions/checkout` necesita.
# Declararlo aqui (en vez de confiar en el default del repo) evita que un job
# nuevo herede permisos de escritura sin querer.
permissions:
  contents: read

concurrency:
  # El grupo incluye el ref A PROPOSITO: agrupar solo por workflow haria que un
  # push a main cancelara el run de una rama (y al reves). Con el ref, los runs
  # de ramas distintas nunca se tocan.
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR -> true: el run viejo ya no describe el codigo que se revisa y lo que
  #   cuesta un runner es lo que se ahorra.
  # main -> false: aqui NO se cancela. Dos razones concretas en este repo:
  #   1. el rotator de modelos hace `git push` directo a main ([skip ci]); con
  #      cancel-in-progress: true ese push podria matar el run del merge humano
  #      que se estaba ejecutando.
  #   2. dejar un run de main a medias consume runner igual y, si el push que
  #      lo sustituyo falla al arrancar, el check que se ve queda en el commit
  #      viejo.
  # CI no publica nada (los artefactos de Playwright son por run), asi que la
  # segunda razon es de coste/coherencia, no de artefacto corrupto. Los
  # workflows que si publican (sbom-scan, restore-drill de otros agentes) usan
  # false siempre.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# shell por defecto para TODOS los `run:` de este workflow. `bash` explicito es
# `bash --noprofile --norc -eo pipefail {0}`; sin `shell:`, GitHub ejecuta
# `bash -e {0}` (SIN pipefail), y ahi `cmd | tee log` devuelve el exit code de
# `tee`, no el de `cmd`: un pytest en rojo pasaba el gate de RAG y un eval
# fallido pasaba el bucle de evals (FIX-3.2). Los pasos con `| tee` llevan
# ademas `set -o pipefail` explicito: doble cinturon por si alguien pone un
# `shell:` que los anule.
defaults:
  run:
    shell: bash

jobs:
  dep-parity:
    name: Python dep parity (pyproject â†” requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 1 explicito aunque ya sea el default de checkout: deja
      # escrita la intension de que este job no lee historial. Sin `cache: pip`
      # a proposito: no instala nada, `sync_requirements.py --check` solo lee
      # pyproject.toml y requirements.txt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
      # requirements.txt sigue siendo el contrato de RANGOS (la intencion) y
      # este job lo mira; uv.lock es la RESOLUCION y ahora tambien se vigila:
      #   - `uv lock --check`: el lock no ha quedado desfasado de pyproject.
      #   - `verify_lockfile.py`: lo fijado satisface lo declarado y trae hashes.
      # uv 0.12.5 a proposito: es el que genero uv.lock (revision = 3).
      - run: python data-engine/scripts/sync_requirements.py --check
      - run: uv lock --check --project data-engine
      - run: python data-engine/scripts/verify_lockfile.py

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      MONGODB_URI: mongodb://localhost:27017/cavaai_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      FMP_BACKEND_URL: http://127.0.0.1:8000
      OPENCODE_GO_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:routes
      - name: ProPicks guard (R1-R5 + turnover cap)
        run: node --experimental-strip-types --test scripts/propicks-guard.test.ts
      - name: Error cause classification (stale/offline/i18n)
        run: node --experimental-strip-types --test scripts/error-cause.test.ts
      - name: Transaction form validation (F1, no silent submits)
        run: node --experimental-strip-types --test scripts/transaction-validation.test.ts
      - name: Server action guards (SSRF, secret redaction, use server exports)
        run: npm run test:guards
      - name: UI format guards (es-ES, scroll movil)
        run: node --experimental-strip-types --test scripts/ui-format-guard.test.ts
      - name: Market date guard (YYYY-MM-DD no pierde un dia)
        # TZ negativa a posta: las fechas YYYY-MM-DD no deben moverse de dia.
        run: TZ=America/New_York node --experimental-strip-types --test scripts/market-date-guard.test.ts
      - name: SSRF guard (export actions)
        run: node --experimental-strip-types --test scripts/export-url-guard.test.ts
      - name: Portfolio score honesty (ausente != 0)
        run: node --experimental-strip-types --test scripts/portfolio-score-honesty.test.ts
      - name: Thesis date guard (invalid date never renders N/D)
        run: node --experimental-strip-types --test scripts/thesis-memo-date-guard.test.ts
      - run: npm run build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

  auth-store:
    name: Auth store smoke (Mongo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sign-up and sign-in against ephemeral MongoDB
        run: node scripts/test-auth-signup.mjs

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_ci.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      # setup-python SOLO aporta el interprete 3.12; no instala nada (sin
      # `cache: pip` ni `cache-dependency-path`: la cache y la instalacion son
      # las de uv). El interprete fijado aqui es el que usa `uv sync`, y
      # coincide con `.python-version`, `ruff.toml` (py312) y
      # `pyrightconfig.json` (3.12) y con `requires-python = ">=3.12,<3.13"`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # uv 0.12.5: el MISMO que genero data-engine/uv.lock (revision = 3).
      # La cache se keya por uv.lock, no por requirements.txt: quien decide que
      # se instala es el lock.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # Instalacion CONGELADA desde uv.lock, nunca desde requirements.txt
      # (rangos: dos runs del mismo commit resuelven distinto). --extra test /
      # --extra dev traen pytest-cov/httpx y ruff==0.16.10 / pyright==1.1.414
      # tal y como los fija el lock: NO hace falta ningun pin de herramienta en
      # este workflow (el lock es el unico sitio donde se fijan versiones).
      # --no-install-project: el paquete no se instala; los scripts corren del
      # working tree, igual que cuando solo existia `pip install -r`.
      - name: Sync congelado desde uv.lock (NO requirements.txt)
        run: uv sync --frozen --extra test --extra dev --no-install-project
      # El lock sigue fiel a los rangos declarados (fail-closed): sin esto, un
      # `uv sync --frozen` instalaria un lock desfasado sin decirlo.
      - name: El lock sigue fiel a los rangos declarados
        run: uv run --frozen python scripts/verify_lockfile.py
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pyright
      # TODO(#fixes): 14 tests preexistentes en rojo en el base del que parte
      # esta rama -- 13 en tests/test_retitle_sec_news_es.py y 1 en
      # tests/test_company_snapshot_batch.py. NO son fallos de CI: en
      # ubuntu-latest pasan. Los 13 mueren en el `os.O_DIRECTORY` de
      # data-engine/scripts/retitle_sec_news_es.py:206, que no existe en win32,
      # asi que solo se ven en el `pytest` de un venv de Windows. Dejarlos
      # anotados para que la ronda de fixes los haga portables y no parezca un
      # fallo nuevo cuando se arreglen.
      - run: uv run --frozen pytest
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/collections && break || sleep 2; done
      - name: RAG activation against real Qdrant (must not skip)
        env:
          CAVAAI_ENABLE_VECTOR_INGEST: "1"
          CAVAAI_ENABLE_VECTOR_SEARCH: "1"
          CAVAAI_ENABLE_VECTOR_CHAT: "1"
        run: |
          # `set -o pipefail` explicito (ademas del `shell: bash` del workflow):
          # sin el, `pytest | tee` devuelve el exit code de `tee` y el gate era
          # incapaz de ponerse en rojo aunque test_rag_activation.py FALLARA
          # (FIX-3.2).
          set -o pipefail
          uv run --frozen python -m pytest tests/test_rag_activation.py -v -rs | tee /tmp/rag_activation.log
          if grep -Eq "[0-9]+ skipped" /tmp/rag_activation.log; then
            echo "RAG activation tests skipped: Qdrant service not reachable" >&2
            exit 1
          fi
      - run: uv run --frozen python scripts/run_financial_evals.py

  evals:
    # Los evals de RAG, valuation, LLM, ingest, backtest y realized viven aqui y
    # no dentro de `backend` por dos motivos: `backend` ya esta a 30 min (su
    # timeout) y los evals son el paso mas lento; y un eval en rojo no debe
    # esconderse detras de `pytest`.
    #
    # fail-fast: NO hay matriz a proposito. Con matriz habria que reinstalar
    # requirements.txt (torch incluido) en 6 runners, y con un unico job el
    # equivalente a `fail-fast: false` se consigue con el bucle de abajo: TODOS
    # los evals se ejecutan aunque uno falle y el job sale rojo si alguno fallo.
    # Se pierde el timeline por script en la UI, se gana no gastar 6 runners.
    name: Evals (RAG, valuation, LLM, ingest, backtest, realized)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_evals_ci.db
      # Vectors ON: los evals de RAG y backtest necesitan el motor de verdad. Si
      # un eval se los encuentra apagados se auto-skipearia, que es justo lo que
      # el gate fail-closed de abajo tiene que cazar.
      CAVAAI_ENABLE_VECTOR_INGEST: "1"
      CAVAAI_ENABLE_VECTOR_SEARCH: "1"
      CAVAAI_ENABLE_VECTOR_CHAT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # Mismo instalador congelado que `backend`: uv.lock, no requirements.txt.
      - run: uv sync --frozen --extra test --extra dev --no-install-project
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/collections && break || sleep 2; done
      - name: "Evals: se ejecutan los presentes y se falla si falta alguno"
        # SIN `if:` a proposito (FIX-3.1). Antes el paso entero se saltaba si
        # faltaba UN solo script (`if: missing == ''`): con dos scripts
        # ausentes en el arbol, los cuatro presentes tampoco se ejecutaban y el
        # job salia VERDE con 0 evals. Ahora la ausencia se convierte en rc=1
        # DENTRO del bucle: los presentes se ejecutan SIEMPRE y el job falla si
        # falta alguno (fail-closed de verdad, sin todo-o-nada).
        # `set -o pipefail` explicito (ademas del `shell: bash` del workflow):
        # sin el, `python ... | tee` devolveria el exit code de `tee`.
        run: |
          set -o pipefail
          rc=0
          for s in run_rag_evals run_valuation_evals run_llm_evals run_ingest_evals run_backtest_evals run_realized_evals; do
            echo "::group::$s"
            if [ ! -f "scripts/$s.py" ]; then
              echo "::error::$s no existe en el arbol: el eval NO se ha evaluado"
              rc=1
            elif uv run --frozen python "scripts/$s.py" 2>&1 | tee "/tmp/$s.log"; then
              # Mismo patron fail-closed que el gate de RAG activation: un eval
              # que se salta tests porque Qdrant o el LLM no estaban NO es un
              # eval verde, es un eval que no ha evaluado nada.
              if grep -Eq "[0-9]+ skipped" "/tmp/$s.log"; then
                echo "::error::$s reporto tests skipped: Qdrant/LLM no disponible y el eval no es fail-closed"
                rc=1
              fi
            else
              echo "::error::$s fallo"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
      - name: Publica los logs de evals como artefacto
        # `always()` + `if-no-files-found: error` (FIX-3.1): subir un artefacto
        # con cero logs tambien tiene que ser rojo, no un verde silencioso.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evals-logs
          path: /tmp/run_*_evals.log
          if-no-files-found: error
          retention-days: 7

  openapi-drift:
    name: OpenAPI generated client drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_openapi_ci.db
      RESEARCH_AUTH_REQUIRED: "false"
    steps:
      # fetch-depth: 1 SUFICE aqui, no hace falta clon completo: `git diff
      # --exit-code` compara el working tree contra el INDICE de HEAD, no contra
      # el log. El drift se detecta igual sin historia.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      - run: npm ci
      # Instalacion congelada desde uv.lock (ver job `backend`): generar el
      # cliente con resoluciones distintas entre runs es justamente el drift
      # que este job viene a cazar.
      - run: uv sync --frozen --extra test --extra dev --no-install-project
        working-directory: data-engine
      - run: npm run generate:openapi
      - run: git diff --exit-code -- data-engine/openapi.json lib/research/openapi.generated.ts

  migrations:
    name: Postgres migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: cavaai_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d cavaai_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: data-engine
    env:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@127.0.0.1:5432/cavaai_research
    steps:
      # Alembic lee los ficheros de alembic/versions/ del working tree y su
      # propia tabla de versiones en Postgres: no consulta git en ningun punto.
      # fetch-depth: 1 explicito para que nadie lo cambie a un clon completo
      # sin motivo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # Instalacion congelada desde uv.lock (ver job `backend`): un alembic que
      # corre contra librerias resueltas distinto cada run no es un round trip
      # reproducible.
      - run: uv sync --frozen --extra test --extra dev --no-install-project
      # Gate de cadena de Alembic, ANTES de tocar la base de datos.
      #
      # Sin este paso, el unico sintoma de una cadena rota es el efecto
      # secundario críptico del paso siguiente: `alembic upgrade head` aborta
      # con "Multiple head revisions are present for given argument 'head'" y
      # `Dockerfile.prod` (que hace upgrade antes de uvicorn) deja el contenedor
      # sin arrancar. El mensaje no dice que fichero duplica el prefijo, ni que
      # hay que renombrar; este gate lo dice antes y en el sitio.
      #
      # Doble cinturon a proposito:
      #   1. `alembic heads | wc -l` sobre la herramienta real, que es la que
      #      aborta en produccion.
      #   2. `test_alembic_chain.py`, que ademas caza lo que `heads` no ve
      #      (prefijo de 4 digitos duplicado, revision != stem, down_revision
      #      huerfano, ciclo, rama colgante) y explica el por que.
      - name: Gate de cadena de Alembic (un solo head)
        run: |
          set -euo pipefail
          heads=$(uv run --frozen python -m alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "::error::alembic tiene $heads heads; la cadena debe ser lineal"
            uv run --frozen python -m alembic heads
            exit 1
          fi
          uv run --frozen python -m pytest tests/test_alembic_chain.py -q
      - name: Empty database to head
        run: uv run --frozen python -m alembic upgrade head
      - name: 0032 rejects a clean downgrade (forward-only)
        # 0032 es forward-only a proposito (restaurar los unique globales
        # reabriria el IntegrityError cross-tenant). El round-trip de
        # downgrade solo cubre revisiones ANTERIORES; aqui se verifica que
        # 0032 rechaza el downgrade sin dejar DDL parcial.
        run: |
          # Con 0033 en head, primero baja 0033 (downgrade limpio y verificado);
          # si no, el raise de 0032 revertiria en la misma transaccion tambien
          # el downgrade de 0033 y `current` quedaria en 0033.
          uv run --frozen python -m alembic downgrade 0032_tenant_uniques_fk_actions
          if uv run --frozen python -m alembic downgrade 0031_propick_runs; then
            echo "0032 downgrade should have raised (forward-only)" >&2
            exit 1
          fi
          uv run --frozen python -m alembic current | grep -q "0032_tenant_uniques_fk_actions"
          uv run --frozen python -c "
          import os
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              names = sa.inspect(conn).get_unique_constraints('fund_managers')
          assert any(c['name'] == 'uq_fund_manager_tenant_cik' for c in names), names
          print('0032 schema intacto tras el raise: uq_fund_manager_tenant_cik existe')
          "
      - name: Pre-0032 round trip on a fresh database
        # El round-trip de downgrade cubre solo revisiones < 0032, asi que
        # necesita una base limpia (desde head no se puede bajar de 0032).
        run: |
          uv run --frozen python -c "
          import os
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ['DATABASE_URL'], isolation_level='AUTOCOMMIT')
          with engine.connect() as conn:
              conn.execute(sa.text('DROP SCHEMA public CASCADE'))
              conn.execute(sa.text('CREATE SCHEMA public'))
          "
          uv run --frozen python -m alembic upgrade 0031_propick_runs
          uv run --frozen python -m alembic downgrade base
          uv run --frozen python -m alembic upgrade 0006_fundamental_model_journal
          uv run --frozen python -m alembic downgrade base
          uv run --frozen python -m alembic upgrade head

  arm64-smoke:
    name: ARM64 compatibility smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_arm_ci.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_SEARCH: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
      CI: "true"
      MONGODB_URI: mongodb://localhost:27017/cavaai_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      FMP_BACKEND_URL: http://127.0.0.1:8000
      OPENCODE_GO_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      # `enable-cache` de uv: este job instala todo el lock (torch CPU incluido)
      # en un runner ARM64, que es el install mas caro del workflow. La cache
      # se keya por uv.lock.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # Instalacion congelada desde uv.lock. SIN los dos pasos manuales de
      # torch: el lock ya fija la variante CPU-only (torch==2.9.1+cpu desde el
      # indice de PyTorch), con sus hashes por plataforma (aarch64 incluido),
      # que es la misma estrategia que Dockerfile.prod. Los pasos manuales
      # elegian version a mano y podian divergir del lock.
      - name: Sync congelado desde uv.lock en ARM64 (torch CPU viene del lock)
        run: uv sync --frozen --extra test --extra dev --no-install-project
      - name: Import backend app on ARM64
        working-directory: data-engine
        run: uv run --frozen python -c "import platform; from main import app; print('backend import OK on', platform.machine())"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend on ARM64 (native modules like tailwind oxide and sharp)
        run: npm run build

  supply-chain:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      # `if: always()` en los tres pasos de audit: un `npm audit` en rojo no
      # debe dejar el lado Python sin auditar. Los hallazgos se ven juntos.
      #
      # DECISION (FIX-3.3): se auditan DOS cosas y no una.
      #   1. requirements.txt = los RANGOS. Es lo que los Dockerfile instalan
      #      todavia (pip install -r), o sea que es lo que puede llegar a
      #      produccion mientras ese cambio no aterrice: una resolucion nueva
      #      de los rangos con una CVE reciente solo se ve aqui.
      #   2. uv.lock = la RESOLUCION congelada que instala CI. Es lo que de
      #      verdad corre en cada run; una version fijada con CVE solo se ve
      #      aqui (auditar solo los rangos la esconderia, porque la resolucion
      #      fresca iria a una version posterior).
      # `uvx pip-audit` flota el AUDITOR (herramienta, no dependencia); lo que
      # se audita si esta fijado. El dia que los Dockerfiles pasen a
      # `uv sync --frozen`, el paso (1) sobra y solo queda (2).
      - name: Install pip-audit
        if: ${{ always() }}
        run: uvx pip-audit --version
      - name: "Audit Python dependencies (rangos de requirements.txt)"
        if: ${{ always() }}
        run: uvx pip-audit -r data-engine/requirements.txt
      - name: "Audit Python dependencies (resolucion congelada de uv.lock)"
        if: ${{ always() }}
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project --project data-engine -o /tmp/lock-reqs.txt
          uvx pip-audit -r /tmp/lock-reqs.txt

  e2e:
    name: Research API E2E
