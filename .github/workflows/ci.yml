  pin-check:
    # FIX-3.9 (capa de enforcement). Los `uses:` de .github/workflows/ van
    # pineados por SHA (con el tag como comentario); este job tumba CI si
    # alguien (o Dependabot a medias) introduce un `uses:` por tag flotante:
    # una etiqueta upstream movida en un workflow con `contents: write` seria
    # escritura en el repo sin revision humana. Las acciones locales
    # (`uses: ./...`) no se pueden pinear y se admiten.
    name: Actions pineadas por SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Ningun `uses:` sin SHA de 40 hex (salvo acciones locales)
        run: |
          set -euo pipefail
          rc=0
          # Patron anclado a la CLAVE `uses:` de YAML (linea que empieza por
          # `uses:` o `- uses:`): no caza los comentarios ni este script.
          while IFS= read -r line; do
            if echo "$line" | grep -Eq 'uses:[[:space:]]*\./'; then
              continue
            fi
            if echo "$line" | grep -Eq '@[0-9a-f]{40}([[:space:]]|$)'; then
              continue
            fi
            echo "::error::uses: sin SHA pineado -> $line"
            rc=1
          done < <(grep -RInE --include='*.yml' --include='*.yaml' '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]' .github/workflows/ || true)
          if [ "$rc" -ne 0 ]; then
            echo "::error::hay uses: por tag flotante: pinealos por SHA (gh api repos/<owner>/<repo>/git/ref/tags/<tag>)"
          fi
          exit $rc

  gate:
    # Un unico check de referencia para branch protection, en vez de 11 checks
    # que hay que mantener sincronizados a mano en la configuracion del repo.
    # AVISO: si anades un job a este workflow, anadelo tambien al `needs:` de
    # abajo. GitHub no expone el listado de jobs del run, asi que un job
    # olvidado aqui NO lo ve este gate y puede quedar verde con ese job en rojo.
    name: CI gate (single required check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dep-parity
      - frontend
      - auth-store
      - backend
      - openapi-drift
      - migrations
      - arm64-smoke
      - supply-chain
      - evals
      - e2e
      - browser-e2e
      - pin-check
    # always(): sin esto el gate se saltaria en cuanto un `needs` fallara, que
    # es justo el caso en el que tiene que ejecutarse.
    if: ${{ always() }}
    outputs:
      # Declarado de forma explicita porque es un contrato: quien consuma este
      # gate (otro workflow, un badge, un script) lee `needs.gate.outputs.failed`
      # en vez de parsear el log.
      failed: ${{ steps.report.outputs.failed }}
    steps:
      - name: Resultado agregado
        id: report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # `failure` y `cancelled` tumban el gate. `skipped` NO: un job
          # saltado a proposito (una rama sin cambios, un motor no aplicable)
          # deberia salir con un aviso, no con el gate en rojo y sin explicacion
          # de cual de los dos fue.
          failed=$(echo "$RESULTS" \
            | jq -r 'to_entries | map(select(.value.result == "failure" or .value.result == "cancelled")) | map("\(.key)=\(.value.result)") | join(", ")')
          skipped=$(echo "$RESULTS" \
            | jq -r 'to_entries | map(select(.value.result == "skipped")) | map(.key) | join(", ")')
          total=$(echo "$RESULTS" | jq -r 'to_entries | length')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "| job | resultado |"
            echo "| --- | --- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$skipped" ]; then
            echo "::warning::jobs saltados (no cuentan como fallo):$skipped"
          fi
          if [ -n "$failed" ]; then
            echo "::error::jobs no verdes: $failed"
            exit 1
          fi
          echo "$total jobs en verde."
          if [ -n "$skipped" ]; then
            echo "Saltados: $skipped"
          fi
