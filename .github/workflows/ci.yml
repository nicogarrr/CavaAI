name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep-parity:
    name: Python dep parity (pyproject ↔ requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python data-engine/scripts/sync_requirements.py --check

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      MONGODB_URI: mongodb://localhost:27017/cavaai_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      FMP_BACKEND_URL: http://127.0.0.1:8000
      OPENCODE_GO_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:routes
      - name: ProPicks guard (R1-R5 + turnover cap)
        run: node --experimental-strip-types --test scripts/propicks-guard.test.ts
      - name: Error cause classification (stale/offline/i18n)
        run: node --experimental-strip-types --test scripts/error-cause.test.ts
      - name: Transaction form validation (F1, no silent submits)
        run: node --experimental-strip-types --test scripts/transaction-validation.test.ts
      - name: Server action guards (SSRF, secret redaction, use server exports)
        run: npm run test:guards
      - name: UI format guards (es-ES, scroll movil)
        run: node --experimental-strip-types --test scripts/ui-format-guard.test.ts
      - name: Market date guard (YYYY-MM-DD no pierde un dia)
        # TZ negativa a posta: las fechas YYYY-MM-DD no deben moverse de dia.
        run: TZ=America/New_York node --experimental-strip-types --test scripts/market-date-guard.test.ts
      - name: SSRF guard (export actions)
        run: node --experimental-strip-types --test scripts/export-url-guard.test.ts
      - name: Portfolio score honesty (ausente != 0)
        run: node --experimental-strip-types --test scripts/portfolio-score-honesty.test.ts
      - name: Thesis date guard (invalid date never renders N/D)
        run: node --experimental-strip-types --test scripts/thesis-memo-date-guard.test.ts
      - run: npm run build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

  auth-store:
    name: Auth store smoke (Mongo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sign-up and sign-in against ephemeral MongoDB
        run: node scripts/test-auth-signup.mjs

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_ci.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      # Versiones de herramientas pineadas a proposito. Sin pin, "ruff hoy" es una
      # cifra distinta cada semana y una regresion de lint aparece sin que nadie
      # haya tocado codigo. `pytest>=8.0.0` es lo que declara
      # [project.optional-dependencies] test de data-engine/pyproject.toml.
      # pytest-cov NO va aqui: el gate de cobertura tiene su propio workflow
      # (.github/workflows/coverage.yml) y su propia linea de install.
      - run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=8.0.0"
          "ruff==0.16.10"
          "pyright==1.1.414"
      - run: python -m ruff check .
      - run: pyright
      - run: python -m pytest
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/collections && break || sleep 2; done
      - name: RAG activation against real Qdrant (must not skip)
        env:
          CAVAAI_ENABLE_VECTOR_INGEST: "1"
          CAVAAI_ENABLE_VECTOR_SEARCH: "1"
          CAVAAI_ENABLE_VECTOR_CHAT: "1"
        run: |
          # `set -o pipefail` NO es cosmetico: sin el, el codigo de salida de un
          # `pytest ... | tee log` es el de `tee` (0 siempre) y un test en rojo
          # pasaria. El `grep` de abajo solo caza los skips; este lignea caza los
          # fallos. Los dos hacen falta.
          set -o pipefail
          python -m pytest tests/test_rag_activation.py -v -rs | tee /tmp/rag_activation.log
          if grep -Eq "[0-9]+ skipped" /tmp/rag_activation.log; then
            echo "RAG activation tests skipped: Qdrant service not reachable" >&2
            exit 1
          fi
      - run: python scripts/run_financial_evals.py

  # ==========================================================================
  # FASE C: los 4 evals como puertas de verdad.
  #
  # Antes de este job los evals de la fase C entraban en CI solo porque
  # `python -m pytest` recoge sus ficheros de tests. Eso es un gate real, pero
  # incompleto: los runners de scripts/run_*.py son la via principal (son los que
  # imprimen el numero y el exit code) y nadie los ejecutaba. Este job los ejecuta.
  #
  # Por que un job propio y no pasos dentro de `backend`:
  #   - `backend` ya esta cerca de su timeout-minutes: 30 con la suite completa,
  #     ruff, pyright y el round trip contra Qdrant. Anadirle 4 runners (uno de
  #     ellos con el embedder real) haria que TODOS los PRs esperaran a los evals.
  #   - este job necesita su propio servicio de Qdrant, su propia descarga
  #     previa del embedder y su propio timeout, y nada de eso puede tener
  #     sentido dentro de `backend`.
  #   - el mismo criterio que justifico el workflow aparte de cobertura.
  #
  # Por que los 4 aqui aunque C3 y C4 tengan ademas su propio workflow:
  #   - `llm-evals.yml` esta filtrado por paths que solo miran evals/, el runner y
  #     los tests: un cambio en app/llm/** o app/workflows/** NO lo dispara, que es
  #     justo el codigo que esos gates existen para vigilar.
  #   - `ci.yml` no lleva filtros de paths: corre en cada push y cada PR. Ser el
  #     unico sitio donde los 4 evals se ejecutan siempre elimina esa clase de
  #     hueco, y el coste es que C3 y C4 se ejecutan dos veces en un PR que toque
  #     sus ficheros.
  # ==========================================================================
  evals:
    name: Phase C evals (RAG, valuation, LLM, ingest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
    defaults:
      run:
        working-directory: data-engine
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_evals_ci.db
      RESEARCH_AUTH_REQUIRED: "false"
      WORKERS_ENABLED: "false"
      HF_HOME: /tmp/hf-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      # Solo pytest: este job no linteriza (eso es del job `backend`) ni mide
      # cobertura (eso es de coverage.yml). Una linea de install minima es una
      # linea que no puede derivar.
      - run: >-
          python -m pip install
          -r requirements.txt
          "pytest>=8.0.0"

      # El embedder (all-MiniLM-L6-v2, ~90 MB) se baja UNA vez aqui, en un paso
      # propio y FUERA del guardian de red del runner de evals. Es exactamente lo
      # que hace data-engine/Dockerfile.prod, y el motivo de que sea aqui y no
      # dentro del runner:
      #
      #   el harness instala un guardian que sustituye socket.connect y solo
      #   permite loopback mas una lista de NOMBRES de Hugging Face. La descarga
      #   real no conecta a "huggingface.co": huggingface_hub resuelve el nombre y
      #   llama a create_connection con la IP ('18.67.250.47', 443), que no esta
      #   en la lista de nombres y queda bloqueada. Por eso
      #   RAG_EVALS_ALLOW_MODEL_DOWNLOAD=1 no puede funcionar y aqui NO se usa.
      #
      # Con el modelo ya en la cache, el runner arranca con HF_HUB_OFFLINE=1 (lo
      # pone evals/rag/rag_harness.py al importarse) y todo el proceso sigue
      # siendo hermetico: la puerta se mide contra el pipeline real sin que el
      # runner pueda abrir un socket a ningun sitio.
      - name: Cache the RAG embedder (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: /tmp/hf-cache
          key: hf-all-minilm-l6-v2-v1
      - name: Pre-download the RAG embedder (outside the harness network guard)
        run: >-
          python -c "from sentence_transformers import SentenceTransformer;
          SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -fs http://localhost:6333/collections && break || sleep 2; done

      # ---- patron fail-closed comun a los 4 pasos siguientes ------------------
      # Cada runner trae su propia lista `failures` en el informe JSON. Cuando el
      # exit code es 1 el log de este paso dice, sin ambiguedad, QUE runner fallo y
      # QUE gate, y lista los fallos concretos del dataset: un "exit 1" a secas
      # obliga a abrir el log de 400 lineas de C1 para saber que se rompio.
      #
      #   set -o pipefail        sin esto, `cmd | tee log` devuelve el codigo de
      #                         tee (0 siempre) y un fallo real pasaria
      #   python ... > informe  el informe JSON va a fichero, no a stdout
      #   ... || true           imprime el diagnosis y NO decide el paso
      #   exit 1                el paso decide, y por nombre
      # -----------------------------------------------------------------------

      - name: C1 RAG golden set (runner run_rag_evals.py, Qdrant real)
        run: |
          set -o pipefail
          runner="scripts/run_rag_evals.py"
          gate="rag_gates + 6 metricas RAGAS"
          informe=/tmp/rag_evals.json
          if python "$runner" --json "$informe"; then
            echo "OK $runner ($gate)"
          else
            echo "::error::runner=$runner gate=$gate FALLIDO (modo real, refuse-to-skip)"
            python - "$informe" <<'PY' || true
          import json, sys
          try:
              report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except Exception as exc:
              print(f"  no se genero informe JSON ({exc}); ver el stderr del runner arriba")
              raise SystemExit(0)
          if report.get("error"):
              print(f"  harness no disponible: {report['error']}")
          for failure in report.get("failures") or ["(sin lista de fallos; ver el log)"]:
              print(f"  - {failure}")
          PY
            exit 1
          fi

      - name: C2 valuation engines (runner run_valuation_evals.py)
        run: |
          set -o pipefail
          runner="scripts/run_valuation_evals.py"
          gate="valuation_gates (13 puertas x 8 motores)"
          informe=/tmp/valuation_evals.json
          if python "$runner" --json > "$informe"; then
            echo "OK $runner ($gate)"
          else
            echo "::error::runner=$runner gate=$gate FALLIDO"
            python - "$informe" <<'PY' || true
          import json, sys
          try:
              report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except Exception as exc:
              print(f"  sin informe JSON utilizable ({exc}); ver el stderr del runner arriba")
              raise SystemExit(0)
          print(f"  dataset={report.get('dataset')} v={report.get('dataset_version')} "
                f"casos={report.get('case_count')} checks={report.get('checks')}")
          for failure in report.get("failures") or ["(sin lista de fallos; ver el log)"]:
              print(f"  - {failure}")
          PY
            exit 1
          fi

      - name: C3 LLM layers (runner run_llm_evals.py)
        run: |
          set -o pipefail
          runner="scripts/run_llm_evals.py"
          gate="llm_gates (12 puertas x 4 capas)"
          informe=/tmp/llm_evals.json
          if python "$runner" --json > "$informe"; then
            echo "OK $runner ($gate)"
          else
            echo "::error::runner=$runner gate=$gate FALLIDO"
            python - "$informe" <<'PY' || true
          import json, sys
          try:
              report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except Exception as exc:
              print(f"  sin informe JSON utilizable ({exc}); ver el stderr del runner arriba")
              raise SystemExit(0)
          print(f"  dataset={report.get('dataset')} casos={report.get('cases')} "
                f"checks={report.get('total_checks')} capas={len(report.get('per_layer') or {})}")
          for failure in report.get("failures") or ["(sin lista de fallos; ver el log)"]:
              print(f"  - {failure}")
          PY
            exit 1
          fi

      - name: C4 ingest precision (runner run_ingest_evals.py)
        run: |
          set -o pipefail
          runner="scripts/run_ingest_evals.py"
          gate="ingest_gates (10 puertas x 3 familias de fuente)"
          informe=/tmp/ingest_evals.json
          if python "$runner" --json > "$informe"; then
            echo "OK $runner ($gate)"
          else
            echo "::error::runner=$runner gate=$gate FALLIDO"
            python - "$informe" <<'PY' || true
          import json, sys
          try:
              report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except Exception as exc:
              print(f"  sin informe JSON utilizable ({exc}); ver el stderr del runner arriba")
              raise SystemExit(0)
          print(f"  dataset={report.get('dataset')} casos={report.get('cases')} "
                f"checks={report.get('checks')} passed={report.get('passed')}")
          for name, data in sorted((report.get("metrics") or {}).items()):
              print(f"  - {name}: {data.get('value')} (>= {data.get('threshold')}) "
                    f"{'OK' if data.get('passed') else 'FALLA'}")
          for failure in (report.get("failures") or [])[:40]:
              print(f"  - {failure}")
          PY
            exit 1
          fi

      # El contrato de C1 que exige que el numero gateado salga del pipeline REAL
      # se auto-skipea sin Qdrant (tests/test_rag_evals_contracts.py), y un skip
      # silencioso ahi es la puerta del RAG evaporandose. Mismo criterio fail-closed
      # que el paso RAG activation del job `backend`: si aparece como skipped, el
      # job falla diciendo por que.
      - name: "C1 contract: the gateable numbers come from the real pipeline (must not skip)"
        run: |
          set -o pipefail
          python -m pytest tests/test_rag_evals_contracts.py -v -rs | tee /tmp/rag_eval_contracts.log
          if grep -Eq "[0-9]+ skipped" /tmp/rag_eval_contracts.log; then
            echo "::error::tests/test_rag_evals_contracts.py skipped: Qdrant service not reachable" >&2
            exit 1
          fi

      # Los 4 informes JSON de los evals. Sin secrets ni tokens: son artefactos
      # publicos, que es lo que cualquiera puede leer para saber que numero salio
      # sin tener que abrir un log de 400 lineas.
      - name: Publish eval reports artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-evals-reports
          path: |
            /tmp/rag_evals.json
            /tmp/valuation_evals.json
            /tmp/llm_evals.json
            /tmp/ingest_evals.json
          if-no-files-found: warn
          retention-days: 14

  openapi-drift:
    name: OpenAPI generated client drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_openapi_ci.db
      RESEARCH_AUTH_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r data-engine/requirements.txt
      - run: npm run generate:openapi
      - run: git diff --exit-code -- data-engine/openapi.json lib/research/openapi.generated.ts

  migrations:
    name: Postgres migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: cavaai_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d cavaai_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: data-engine
    env:
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@127.0.0.1:5432/cavaai_research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Empty database to head
        run: python -m alembic upgrade head
      - name: 0032 rejects a clean downgrade (forward-only)
        # 0032 es forward-only a proposito (restaurar los unique globales
        # reabriria el IntegrityError cross-tenant). El round-trip de
        # downgrade solo cubre revisiones ANTERIORES; aqui se verifica que
        # 0032 rechaza el downgrade sin dejar DDL parcial.
        run: |
          # Con 0033 en head, primero baja 0033 (downgrade limpio y verificado);
          # si no, el raise de 0032 revertiria en la misma transaccion tambien
          # el downgrade de 0033 y `current` quedaria en 0033.
          python -m alembic downgrade 0032_tenant_uniques_fk_actions
          if python -m alembic downgrade 0031_propick_runs; then
            echo "0032 downgrade should have raised (forward-only)" >&2
            exit 1
          fi
          python -m alembic current | grep -q "0032_tenant_uniques_fk_actions"
          python -c "
          import os
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              names = sa.inspect(conn).get_unique_constraints('fund_managers')
          assert any(c['name'] == 'uq_fund_manager_tenant_cik' for c in names), names
          print('0032 schema intacto tras el raise: uq_fund_manager_tenant_cik existe')
          "
      - name: Pre-0032 round trip on a fresh database
        # El round-trip de downgrade cubre solo revisiones < 0032, asi que
        # necesita una base limpia (desde head no se puede bajar de 0032).
        run: |
          python -c "
          import os
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ['DATABASE_URL'], isolation_level='AUTOCOMMIT')
          with engine.connect() as conn:
              conn.execute(sa.text('DROP SCHEMA public CASCADE'))
              conn.execute(sa.text('CREATE SCHEMA public'))
          "
          python -m alembic upgrade 0031_propick_runs
          python -m alembic downgrade base
          python -m alembic upgrade 0006_fundamental_model_journal
          python -m alembic downgrade base
          python -m alembic upgrade head

  arm64-smoke:
    name: ARM64 compatibility smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./cavaai_arm_ci.db
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_SEARCH: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
      CI: "true"
      MONGODB_URI: mongodb://localhost:27017/cavaai_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      FMP_BACKEND_URL: http://127.0.0.1:8000
      OPENCODE_GO_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Mismo orden que data-engine/Dockerfile.prod: torch CPU-only primero
      # (indice oficial PyTorch, tiene wheels linux/aarch64) y luego el resto.
      # Asi CI prueba la estrategia exacta de la imagen de Oracle y evita
      # descargar los wheels CUDA (multi-GB) tambien en CI.
      - name: Install torch CPU-only on ARM64 (same as Dockerfile.prod)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install backend deps on ARM64 (pandas, scipy, sentence-transformers)
        run: python -m pip install -r data-engine/requirements.txt
      - name: Import backend app on ARM64
        working-directory: data-engine
        run: python -c "import platform; from main import app; print('backend import OK on', platform.machine())"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build frontend on ARM64 (native modules like tailwind oxide and sharp)
        run: npm run build

  supply-chain:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Install pip-audit
        if: ${{ always() }}
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        if: ${{ always() }}
        run: python -m pip_audit -r data-engine/requirements.txt

  e2e:
    name: Research API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: cavaai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d cavaai_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      APP_ENV: test
      E2E_RUN: "1"
      E2E_API_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@127.0.0.1:5432/cavaai_e2e
      CAVAAI_ENABLE_VECTOR_INGEST: "0"
      CAVAAI_ENABLE_VECTOR_CHAT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r data-engine/requirements.txt
      - run: python -m alembic upgrade head
        working-directory: data-engine
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      E2E_UI_RUN: "1"
      RESEARCH_AUTH_SECRET: cavaai-browser-e2e-research-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-engine/requirements.txt
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r data-engine/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
