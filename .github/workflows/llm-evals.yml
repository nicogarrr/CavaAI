name: LLM layer evals

# Gate rapido y HERMETICO de los evals de las 4 capas LLM
# (evals/llm/*). Deliberadamente no levanta Postgres/Qdrant: el judge es
# codigo puro (solo stdlib) y su unica dependencia es `evals.gates._norm_number`.
# Las herramientas (ruff, pytest) y las dependencias salen AHORA de uv.lock
# (FIX-3.3/3.4), que es el unico sitio donde se fijan versiones: antes este
# job hacia `pip install pytest ruff` sin pin (tres versiones distintas de
# ruff convivian en el repo). La env contiene ademas las dependencias del
# proyecto, pero la hermetica del judge la siguen vigilando sus tests
# (tests/test_llm_layer_evals.py): si algun dia el judge empezara a importar
# app.llm o a abrir red, estos tests son los que tienen que ponerse en rojo.

on:
  pull_request:
    paths:
      - "data-engine/evals/**"
      - "data-engine/scripts/run_llm_evals.py"
      - "data-engine/tests/test_llm_*.py"
      - ".github/workflows/llm-evals.yml"
  push:
    branches: [main]
    paths:
      - "data-engine/evals/**"
      - "data-engine/scripts/run_llm_evals.py"
      - "data-engine/tests/test_llm_*.py"
      - ".github/workflows/llm-evals.yml"
  workflow_dispatch:

# Minimos explicitos (FIX-3.8): sin `permissions:`, este workflow heredaria el
# default del repo (si es contents: write, tiene escritura sin necesitarla).
# Solo lee el checkout y sube un artefacto: contents: read basta.
permissions:
  contents: read

# shell por defecto: `bash` explicito (= `bash -eo pipefail`); sin el, un
# `cmd | tee` perderia el exit code del comando real (FIX-3.2).
defaults:
  run:
    shell: bash

concurrency:
  group: llm-evals-${{ github.ref }}
  # PR -> true: el run viejo ya no describe el codigo que se revisa.
  # push a main -> false: este workflow PUBLICA llm-evals-report como
  #   artefacto (if-no-files-found: error). Cancelar un push a mitad deja el
  #   commit sin el informe que justifica el gate: la evidencia publicada no
  #   se cancela (FIX-3.6, mismo criterio que coverage.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  llm-layer-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "data-engine/uv.lock"
      # Sin pins de herramientas: el lock trae ruff==0.16.10 y pytest via
      # extras test/dev (FIX-3.4). Antes: `pip install pytest ruff` flotando.
      - run: uv sync --frozen --extra test --extra dev --no-install-project
      - name: Ruff sobre el judge y sus gates
        run: uv run --frozen ruff check evals scripts tests
      - name: Los gates de las 4 capas LLM (sin red, sin proveedor)
        run: uv run --frozen python scripts/run_llm_evals.py
      - name: Informe JSON para el resumen del PR
        run: uv run --frozen python scripts/run_llm_evals.py --json > llm-evals-report.json
      - name: Tests de la puerta de CI
        run: uv run --frozen python -m pytest tests/test_llm_layer_evals.py -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-evals-report
          path: data-engine/llm-evals-report.json
          if-no-files-found: error