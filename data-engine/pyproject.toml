[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavaai-data-engine"
version = "1.0.0"
description = "FastAPI data engine for CavaAI"
# Interpreter UNICO y declarado. 3.12 no es arbitrario: es lo que ejecutan los
# dos Dockerfiles (python:3.12-slim), los 8 jobs de .github/workflows/ci.yml
# (python-version: "3.12"), ruff.toml (target-version = "py312") y
# pyrightconfig.json (pythonVersion: "3.12"). Antes decia ">=3.11", un piso mas
# permisivo que cualquier runtime real del repo: hacia que uv lock resolviera
# para un rango que nadie ejecuta y que el .venv local de 3.11.16 se salia.
# La discrepancia se ha resuelto subiendo el suelo a donde ya apuntaban los otros
# cuatro, no bajandolos a 3.11. Techo <3.13 para que un 3.13 no instale el lock
# en silencio: si se sube el runtime, se sube aqui y se re-loca a proposito.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139.0,<0.142",
    "starlette>=1.3.1,<1.8",
    "uvicorn[standard]>=0.29.0,<0.35",
    "python-dotenv>=1.0.0,<2",
    "python-multipart>=0.0.9,<0.1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.4.0,<3",
    "requests>=2.31.0,<3",
    "httpx>=0.27.0,<0.29",
    "yfinance>=0.2.40,<0.3",
    # Ingesta SEC paralela tipada (ver app/services/edgartools_ingestion_service.py).
    # Solo UA declarado, sin API key. Detras de flag EDGARTOOLS_ENABLED.
    "edgartools>=5.59.1,<6",
    "pandas>=2.0.0,<3",
    "lxml>=6.1.1,<7",
    "scipy>=1.11.0,<2",
    "hmmlearn>=0.3.3,<0.4",
    "numpy>=1.24.0,<3",
    "matplotlib>=3.7.0,<4",
    "seaborn>=0.13.0,<0.14",
    "tabulate>=0.9.0,<0.10",
    "python-dateutil>=2.8.0,<3",
    "arch>=6.0,<9",
    "qdrant-client>=1.9.0,<1.15",
    "redis>=5.0.0,<6",
    # Embeddings RAG locales (all-MiniLM-L6-v2, ver app/services/rag.py).
    # torch es dependencia de sentence-transformers: se instala SIEMPRE la
    # variante CPU desde el indice de PyTorch (ver requirements.txt y los
    # Dockerfiles); la wheel CUDA por defecto de PyPI son GB inservibles
    # en una VM CPU-only.
    "torch>=2.5",
    "sentence-transformers>=5.6.0,<6",
    # Transitiva via sentence-transformers (tokenizers del embedder); sin
    # import directo en app/. Pin explicito para que no flote con ST.
    "transformers>=5.13.1,<6",
    # Retrieval hibrido denso+sparse sobre Qdrant (ver app/services/rag.py y
    # app/services/hybrid_retrieval.py). fastembed es el motor ONNX CPU-only
    # (mismo modelo/dims que ST, sin GPU); onnxruntime explicito porque lo
    # comparten fastembed y docling y la version importa en ARM.
    "fastembed>=0.8.1,<1",
    "onnxruntime>=1.20.1,<2",
    "pypdf>=6.14.2,<7",
    "openpyxl>=3.1.0,<4",
    "python-docx>=1.1.0,<2",
    # Ingesta en dos carriles (ver app/services/docling_pipeline.py): MarkItDown
    # como pre-filter rapido (<1 s) y Docling para estructura/tablas/XBRL con
    # provenance por pagina. El extra [pdf] es obligatorio: el paquete base no
    # convierte PDFs. Ambos con import perezoso y fallback a pypdf.
    "docling>=2.132.0,<3",
    "markitdown[pdf]>=0.1.8,<1",
    # RAG de conocimiento profesional (app/services/knowledge_rag/). SOLO
    # llama-index-core como caja de herramientas de retrieval (TextNode,
    # NodeWithScore, QueryBundle, postprocesadores). Sin llama-index-vector-
    # stores-qdrant (exige qdrant-client>=1.16; prod pinea <1.15 y su Qdrant
    # server es 1.12.5), sin LlamaParse/LlamaCloud ni integraciones OpenAI.
    "llama-index-core>=0.14.25,<0.15",
    # Export EPUB 100% Python sin binario externo (ver
    # app/services/thesis_epub_service.py). AGPL-3.0 = misma licencia que la app.
    "EbookLib>=0.20,<1",
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.10.0",
    "agent-framework-orchestrations==1.0.0",
    "sqlalchemy>=2.0.32,<2.1",
    "alembic>=1.13.2,<1.21",
    "psycopg[binary]>=3.2.1,<4",
    # duckdb se evaluo y se retiro: ningun modulo de app/ lo importa (solo
    # queda el default duckdb_path en config como ruta historica). El
    # analytics local vive en Postgres + ficheros; no reintroducir sin uso.
    "minio>=7.2.7,<8",
    "dramatiq[redis]>=1.17.0,<2",
    "apscheduler>=3.10.4,<4",
    "langfuse>=3.0.0,<4",
    # Thesis lifecycle shadow pilot (stage 6): usados en app/workflows/ y
    # app/services/thesis_*_service.py. Solo estado de control en esquema
    # separado; la verdad de negocio sigue en Postgres.
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    # httpcore: public_fetch usa backends privados (IP pinning anti-SSRF);
    # fijar la major para que un upgrade falle controlado, no en silencio.
    "httpcore>=1.0.0,<2.0",
]

[project.optional-dependencies]
# pytest-cov vive AQUI y no en requirements.txt a proposito: el job dep-parity
# corre `python data-engine/scripts/sync_requirements.py --check`, que exige
# paridad exacta y BIDIRECCIONAL entre [project].dependencies y requirements.txt.
# sync_requirements.py no inspecciona optional-dependencies, asi que anadirlo
# aqui no rompe la paridad y hace que `pip install -e .[test]` traiga el gate de
# cobertura. Los workflows lo instalan ademas en su propia linea de install,
# porque no instalan el paquete (usan requirements.txt).
test = ["pytest>=8.0.0", "httpx>=0.27.0", "pytest-cov>=5.0"]
# Tooling de calidad. Hoy CI los instala sueltos y sin pin
# (`pip install -r requirements.txt pytest ruff pyright`), o sea que ruff y
# pyright flotan entre runs y un green local puede ser rojo en CI (o al
# reves) sin que nadie haya tocado codigo. Aqui van fijados para que el lock
# los cubra tambien.
dev = ["ruff==0.16.10", "pyright==1.1.414"]

[tool.uv]
# Los rangos de [project].dependencies son intencion (los exige el gate
# dep-parity contra requirements.txt); uv.lock es quien los resuelve. Ver
# LOCKFILE.md.
#
# torch: el pin CPU-only (TORCH_CPU_PIN en scripts/sync_requirements.py, el
# mismo que hardcodean Dockerfile.prod y Dockerfile) NO existe en PyPI: la
# variante +cpu vive solo en el indice oficial de PyTorch. Sin este bloque uv
# resolveria la wheel CUDA de PyPI (GB inservibles en CPU-only) y el lock
# dejaria de ser equivalente a las imagenes de produccion.
constraint-dependencies = ["torch==2.14.1+cpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "modules*", "routers*", "quantstats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
cache_dir = "storage/.pytest_cache"
# Marcadores registrados. Sin `markers`, pytest avisa con
# PytestUnknownMarkWarning en cuanto se usa uno, y un marker no registrado es
# un `-m "not ..."` que no deselecciona nada: un filtro silenciosamente vacio.
#
# `services` marca lo que necesita un servicio externo VIVO (Qdrant en
# localhost:6333, Postgres). Sirve para la suite rapida, que puede correrse
# sin Docker:
#     python -m pytest tests -m "not services"
#
# OJO: el marker NO sustituye al gate fail-closed de ci.yml. El job `backend`
# corre la suite completa sin `-m` y ademas falla si
# tests/test_rag_activation.py aparece como skipped, porque un marker se puede
# anular con `-m` y un `skipif` automatico no. El marker es la via rapida; el
# grep es la puerta.
markers = [
    "services: requiere un servicio externo vivo (Qdrant, Postgres)",
]

# La medicion de cobertura vive en data-engine/.coveragerc, NO aqui y NO en
# [tool.coverage]. Motivo tecnico: coverage.py lee .coveragerc y
# pyproject.toml [tool.coverage] con la MISMA precedencia, y cuando coexisten
# .coveragerc gana y el resto se ignora EN SILENCIO. Dos ficheros de
# configuracion de la misma medicion es exactamente el fallo que hace que un
# numero deje de gatear sin que nadie lo note. Se deja solo .coveragerc, que
# ademas es donde se documenta include_namespace_packages = True.
