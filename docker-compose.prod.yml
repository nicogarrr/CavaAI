# ============================================================
# Docker Compose - Produccion personal (Oracle Ampere Always Free)
# ============================================================
# Una sola VM ARM64 (2 OCPU / 12 GB RAM, Always Free sin upgrade), un solo usuario.
# El frontend sigue en Vercel Hobby; la auth vive en MongoDB Atlas
# (M0 gratis), asi que aqui NO va ni frontend ni MongoDB.
#
# Uso: docker compose -f docker-compose.prod.yml up -d
# Requisitos: .env.production (ver docs/oracle-setup.md)

services:
  # TLS + reverse proxy hacia el backend (un subdominio DuckDNS gratis).
  caddy:
    image: caddy:2-alpine
    container_name: cavaai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:?Define BACKEND_DOMAIN (p.ej. cavaai-api.duckdns.org) en .env.production}
    healthcheck:
      # Sin endpoint HTTP neutro (TLS/SNI depende del dominio): se verifica el binario.
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: cavaai-postgres
    restart: unless-stopped
    # Sin puerto publico: solo red interna de compose.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-portfolio}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.production}
      - POSTGRES_DB=${POSTGRES_DB:-cavaai_research}
      - TZ=UTC
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - ASTS_LLM_ENABLED=${ASTS_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      - PGTZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-cavaai_research}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: cavaai-redis
    restart: unless-stopped
    # Cola Dramatiq + cache; AOF para no perder jobs en reinicio.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: cavaai-qdrant
    restart: unless-stopped
    # Solo loopback: operaciones (snapshots) y diagnostico, sin exponer a internet.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # La imagen de Qdrant no incluye curl/wget: GET /healthz con bash (/dev/tcp).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  minio:
    # Build local desde el codigo fuente de MinIO (la imagen de quay ya no es publica): docker/minio/Dockerfile.
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: cavaai-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: cavaai-minio
    restart: unless-stopped
    command: server --address ":9000" /data
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env.production}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env.production}
    healthcheck:
      # La imagen minio/minio no incluye curl/mc: sonda HTTP al endpoint live con bash (/dev/tcp).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./data-engine
      dockerfile: Dockerfile.prod
    image: cavaai-backend:prod
    container_name: cavaai-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      # Version desplegada que expone /api/health (la imagen no lleva git):
      # se exporta al desplegar, p. ej. APP_VERSION=main-$(git rev-parse --short HEAD).
      - APP_VERSION=${APP_VERSION:-}
      # El scheduler corre en su propio servicio (cavaai-scheduler);
      # sin esto, el backend arrancaria una segunda copia embebida.
      - WORKERS_ENABLED=false
      - RESEARCH_AUTH_REQUIRED=true
      - RESEARCH_AUTH_SECRET=${RESEARCH_AUTH_SECRET:?Obligatorio}
      - FMP_API_KEY=${FMP_API_KEY:-}
      # Solo adiciones de mapeo: sin FINNHUB no hay screener Finnhub en prod
      # (fallback Yahoo); sin FRED no hay macro; sin TYPESAFE no hay Jev;
      # sin TELEGRAM_* no se envia nada (degradado a UI).
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SCREENER_QUOTE_VENDOR=${SCREENER_QUOTE_VENDOR:-finnhub}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - ASTS_LLM_ENABLED=${ASTS_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      # RAG: sin =1 no hay ingesta/busqueda/chat vectorial (degradado a SQL).
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - CAVAAI_ENABLE_VECTOR_CHAT=${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-space-bunny-free}
      - OPENCODE_GO_FALLBACK_MODEL=${OPENCODE_GO_FALLBACK_MODEL:-}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=research
      - DUCKDB_PATH=/data/analytics.duckdb
      - LANGFUSE_ENABLED=false
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - SEC_SNAPSHOT_DIR=${SEC_SNAPSHOT_DIR:-}
      - SEC_HF_MIRROR_DATASET=${SEC_HF_MIRROR_DATASET:-}
      - ESEF_SNAPSHOT_DIR=${ESEF_SNAPSHOT_DIR:-/data/esef-snapshots}
    volumes:
      - duckdb_data:/data
      - ./data-esef-snapshots:/data/esef-snapshots:ro
    healthcheck:
      # python:3.12-slim no trae curl: sonda equivalente a `curl -f http://localhost:8000/health/ready`.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  worker:
    image: cavaai-backend:prod
    container_name: cavaai-worker
    restart: unless-stopped
    command: ["dramatiq", "app.workers.dramatiq_app", "--processes", "1", "--threads", "6", "-Q", "default", "prices"]
    environment:
      - PYTHONUNBUFFERED=1
      # Solo adiciones de mapeo: el worker ejecuta los actores (refresh de
      # mercado, feeds, alertas) y necesita las mismas claves que el backend.
      # Sin FMP_API_KEY no hay contraste FMP en el refresh programado.
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SCREENER_QUOTE_VENDOR=${SCREENER_QUOTE_VENDOR:-finnhub}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - ASTS_LLM_ENABLED=${ASTS_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - CAVAAI_ENABLE_VECTOR_CHAT=${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-space-bunny-free}
      - OPENCODE_GO_FALLBACK_MODEL=${OPENCODE_GO_FALLBACK_MODEL:-}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=research
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - SEC_SNAPSHOT_DIR=${SEC_SNAPSHOT_DIR:-}
      - SEC_HF_MIRROR_DATASET=${SEC_HF_MIRROR_DATASET:-}
      - ESEF_SNAPSHOT_DIR=${ESEF_SNAPSHOT_DIR:-/data/esef-snapshots}
      # Opt-in (#726): top_ten_sp500 se calcula en refresh_macro_context (cola default).
      - SP500_FACTSHEET_SNAPSHOT_DIR=${SP500_FACTSHEET_SNAPSHOT_DIR:-/data/sp500-factsheet-snapshots}
      - RSS_FEEDS=${RSS_FEEDS:-}
    volumes:
      - duckdb_data:/data
      - ./data-esef-snapshots:/data/esef-snapshots:ro
      - ./data-sp500-factsheet-snapshots:/data/sp500-factsheet-snapshots:ro
    healthcheck:
      # Sin HTTP: dramatiq vivo (PID 1) + Redis de cola accesible.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'dramatiq' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G

  worker-thesis:
    image: cavaai-backend:prod
    container_name: cavaai-worker-thesis
    restart: unless-stopped
    # F359: worker DEDICADO a la cola thesis (jobs interactivos del usuario).
    # Compartir proceso/hilos con default/prices dejaba la tesis hambreada
    # cuando la ingesta por lotes ocupaba los threads (7476 mensajes).
    command: ["dramatiq", "app.workers.dramatiq_app", "--processes", "1", "--threads", "2", "-Q", "thesis"]
    environment:
      - PYTHONUNBUFFERED=1
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-space-bunny-free}
      - OPENCODE_GO_FALLBACK_MODEL=${OPENCODE_GO_FALLBACK_MODEL:-}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - CAVAAI_ENABLE_VECTOR_CHAT=${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=research
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - SEC_SNAPSHOT_DIR=${SEC_SNAPSHOT_DIR:-}
      - SEC_HF_MIRROR_DATASET=${SEC_HF_MIRROR_DATASET:-}
      - ESEF_SNAPSHOT_DIR=${ESEF_SNAPSHOT_DIR:-/data/esef-snapshots}
      - RSS_FEEDS=${RSS_FEEDS:-}
    volumes:
      - duckdb_data:/data
      - ./data-esef-snapshots:/data/esef-snapshots:ro
    healthcheck:
      # Sin HTTP: dramatiq vivo (PID 1) + Redis de cola accesible.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'dramatiq' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  worker-kpis:
    image: cavaai-backend:prod
    container_name: cavaai-worker-kpis
    restart: unless-stopped
    # Worker dedicado a la cola kpis: la cola default (fan-out de ingesta)
    # ahogaba los 2 hilos compartidos y los KPI morian de inanicion.
    command: ["dramatiq", "app.workers.dramatiq_app", "--processes", "1", "--threads", "4", "-Q", "kpis"]
    environment:
      - PYTHONUNBUFFERED=1
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SCREENER_QUOTE_VENDOR=${SCREENER_QUOTE_VENDOR:-finnhub}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - ASTS_LLM_ENABLED=${ASTS_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - CAVAAI_ENABLE_VECTOR_CHAT=${CAVAAI_ENABLE_VECTOR_CHAT:-0}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY:-}
      - OPENCODE_GO_BASE_URL=${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/v1}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-space-bunny-free}
      - OPENCODE_GO_FALLBACK_MODEL=${OPENCODE_GO_FALLBACK_MODEL:-}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=research
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - SEC_SNAPSHOT_DIR=${SEC_SNAPSHOT_DIR:-}
      - SEC_HF_MIRROR_DATASET=${SEC_HF_MIRROR_DATASET:-}
      - ESEF_SNAPSHOT_DIR=${ESEF_SNAPSHOT_DIR:-/data/esef-snapshots}
      - RSS_FEEDS=${RSS_FEEDS:-}
    volumes:
      - duckdb_data:/data
      - ./data-esef-snapshots:/data/esef-snapshots:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'dramatiq' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G

  worker-alerts:
    image: cavaai-backend:prod
    container_name: cavaai-worker-alerts
    restart: unless-stopped
    # Worker DEDICADO a la cola alerts (patron thesis/kpis): la evaluacion de
    # reglas cada 5 min y las entregas se hambreaban detras de la ingesta
    # larga de GDELT (~3 h) en la cola default compartida.
    command: ["dramatiq", "app.workers.dramatiq_app", "--processes", "1", "--threads", "2", "-Q", "alerts"]
    environment:
      - PYTHONUNBUFFERED=1
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=research
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'dramatiq' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  worker-gdelt:
    image: cavaai-backend:prod
    container_name: cavaai-worker-gdelt
    restart: unless-stopped
    # Worker DEDICADO al carril GDELT (refresh_news / refresh_macro_news).
    # GDELT limita por IP (~1 req / 5 s) y el pacing del cliente es un
    # threading.Lock in-process: EXACTAMENTE UN proceso (--processes 1) para
    # que el pacing sea global al carril; con 2 procesos cada uno paceria
    # por su cuenta y la tasa combinada provocaria 429 en tormenta.
    command: ["dramatiq", "app.workers.dramatiq_app", "--processes", "1", "--threads", "2", "-Q", "gdelt"]
    environment:
      - PYTHONUNBUFFERED=1
      - FMP_API_KEY=${FMP_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - SCREENER_QUOTE_VENDOR=${SCREENER_QUOTE_VENDOR:-finnhub}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_APPROVAL_ENABLED=${TELEGRAM_APPROVAL_ENABLED:-false}
      - INSIDER_ALERTS_ENABLED=${INSIDER_ALERTS_ENABLED:-false}
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
      - CAVAAI_ENABLE_VECTOR_INGEST=${CAVAAI_ENABLE_VECTOR_INGEST:-0}
      - CAVAAI_ENABLE_VECTOR_SEARCH=${CAVAAI_ENABLE_VECTOR_SEARCH:-0}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=qdrant
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=research
      - SEC_USER_AGENT=${SEC_USER_AGENT:-CavaAI/0.1 contact@example.com}
      - SEC_HF_MIRROR_DATASET=${SEC_HF_MIRROR_DATASET:-}
    volumes:
      - duckdb_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'dramatiq' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  scheduler:
    image: cavaai-backend:prod
    container_name: cavaai-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cavaai_research}
      - REDIS_URL=redis://redis:6379/0
      - TZ=UTC
      - SECOND_ORDER_LLM_ENABLED=${SECOND_ORDER_LLM_ENABLED:-0}
      - ASTS_LLM_ENABLED=${ASTS_LLM_ENABLED:-0}
      - THESIS_NARRATIVE_LLM_ENABLED=${THESIS_NARRATIVE_LLM_ENABLED:-0}
    healthcheck:
      # Sin HTTP: scheduler vivo (PID 1) + Redis accesible.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,redis; sys.exit(0 if 'app.workers.scheduler' in open('/proc/1/cmdline','rb').read().decode(errors='ignore') and redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3).ping() else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
    name: cavaai-prod-postgres
  redis_data:
    name: cavaai-prod-redis
  qdrant_data:
    name: cavaai-prod-qdrant
  minio_data:
    name: cavaai-prod-minio
  duckdb_data:
    name: cavaai-prod-duckdb
  caddy_data:
    name: cavaai-prod-caddy
  caddy_config:
    name: cavaai-prod-caddy-config
