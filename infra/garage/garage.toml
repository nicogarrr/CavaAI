# Garage de nodo unico para CavaAI (v2.4.x). Los secretos NO van aqui:
# GARAGE_RPC_SECRET y las claves por defecto llegan por entorno (compose).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# sqlite: mas tolerante a cortes bruscos que lmdb (la VM ya se reinicio sola).
db_engine = "sqlite"
metadata_fsync = true
data_fsync = true
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
